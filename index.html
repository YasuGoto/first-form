<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テストページ</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <h1>テストページ</h1>
  <ul>
    <li>
      <h2>VRT</h2>
      <!-- シンプルフォーム -->
      <form id="simple-form">
        <label>
          Name:
          <input type="text" id="name-input">
        </label>
        <button type="submit">Submit</button>
      </form>
      <p id="greeting">ここに挨拶が表示されます</p>

      <!-- アコーディオン -->
      <div class="accordion">
        <button id="accordion-btn">アコーディオンタイトル</button>
        <div id="accordion-content" class="hidden">
          ここがアコーディオンのコンテンツです。
        </div>
      </div>
    </li>
    <li>
      <h2>バリデーション</h2>
      <form id="form1">
        <label for="name">
          名前：
          <input type="text" id="name">
        </label>
        <label for="email">
          メールアドレス：
          <input type="email" id="email">
        </label>
        <p class="message"></p>
        <button type="submit">送信</button>
      </form>
    </li>
  </ul>

  <script type="module" src="./vrt.ts"></script>
  <script type="module" src="./main.ts"></script>
</body>

</html>
