<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テストページ</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <h1>テストページ</h1>
  <ul>
    <li>
      <h2>VRT</h2>
      <!-- シンプルフォーム -->
      <form id="simple-form">
        <label>
          Name:
          <input type="text" id="name-input">
        </label>
        <button type="submit">Submit</button>
      </form>
      <p id="greeting">ここに挨拶が表示されます</p>

      <!-- アコーディオン -->
      <div class="accordion">
        <button id="accordion-btn">アコーディオンタイトル</button>
        <div id="accordion-content" class="hidden">
          ここがアコーディオンのコンテンツです。
        </div>
      </div>
    </li>
    <li>
      <h2>バリデーション</h2>
      <h3>必須入力チェック</h3>
      <form id="form1">
        <label for="name">
          名前：
          <input type="text" id="name" class="input">
        </label>
        <label for="email">
          メールアドレス：
          <!-- バリデーションの勉強用にtextに設定 -->
          <input type="text" id="email" class="input">
        </label>
        <p class="message"></p>
        <button type="submit">送信！</button>
      </form>
      <h3>パスワードチェック</h3>
      <form id="form2">
        <label for="pass">
          パスワード：
          <input type="password" id="pass" class="input">
        </label>
        <label for="pass_confirm">
          パスワード確認：
          <input type="password" id="pass_confirm" class="input">
        </label>
        <label for="check">
          <input type="checkbox" id="agree" class="input">
          利用規約に同意する
        </label>
        <p class="message"></p>
        <button type="submit">送信！</button>
      </form>
    </li>
  </ul>

  <script type="module" src="./vrt.ts"></script>
  <script type="module" src="./main.ts"></script>
</body>

</html>
